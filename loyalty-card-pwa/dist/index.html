    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Vite typically handles service worker registration differently,
          // often through a plugin like vite-plugin-pwa.
          // For now, we'll keep the path relative to the public root.
          // If service-worker.js is in public, '/service-worker.js' should work.
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(error => {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
