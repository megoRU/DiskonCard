<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico">
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DiskonCard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <script>
    (function() {
      let preferredTheme = localStorage.getItem('themePreference'); // Can be 'light', 'dark', or 'system'
      let effectiveTheme;

      if (preferredTheme === 'light' || preferredTheme === 'dark') {
        effectiveTheme = preferredTheme;
      } else { // Covers 'system' or null (no preference set yet)
        effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      document.documentElement.setAttribute('data-theme', effectiveTheme);

      const metaThemeColor = document.querySelector('meta[name="theme-color"]');
      if (metaThemeColor) {
        // Assuming --background-primary holds the main background for each theme
        // These specific color values are from the :root and [data-theme="dark"] in index.css
        metaThemeColor.setAttribute('content', effectiveTheme === 'dark' ? '#000000' : '#f9f9f9');
      }
    })();
  </script>
  <meta name="description" content="DiskonCard Progressive Web App">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="utf-8">
  <base href="/">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                  console.log('ServiceWorker registration successful with scope: ', registration.scope);
                })
                .catch(error => {
                  console.log('ServiceWorker registration failed: ', error);
                });
      });
    }
  </script>
