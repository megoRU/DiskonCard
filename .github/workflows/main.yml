name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Необходимо для docker/login-action

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./loyalty-card-pwa # Указываем контекст сборки, где находится Dockerfile
          file: ./loyalty-card-pwa/Dockerfile # Путь к Dockerfile
          push: true
          tags: |
            megoru/diskoncard:latest
            megoru/diskoncard:${{ github.sha }}
          platforms: linux/amd64,linux/arm64 # Собираем для нескольких платформ (опционально, но полезно)
